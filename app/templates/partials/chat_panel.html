<section class="chat" id="chat" data-chat-id="{{ chat.id }}">
  <div class="chat-log" id="chat-log">
    {% if not messages %}
    <div class="chat-empty">
      <p><strong>Hi! I'm Nudge ✦</strong></p>
      <p>Tell me what you're working on or where you're stuck. I'll ask questions, give hints and explain ideas — but I won't hand you the answer.</p>
    </div>
    {% endif %}
    {% for m in messages %}
    <div class="msg {{ m.role }}">
      {% if m.role == 'assistant' %}<div class="assistant-avatar">✦</div>{% endif %}
      <div class="bubble {% if m.role == 'assistant' %}md{% endif %}">{{ m.content }}</div>
    </div>
    {% endfor %}
    <div class="msg assistant" id="typing" style="display:none">
      <div class="assistant-avatar">✦</div>
      <div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div>
    </div>
  </div>
  <div class="chat-quick" id="chat-quick">
    <button type="button" class="quick-chip" data-fill="I'm stuck — can you ask me questions to figure out where I went wrong?">🤔 I'm stuck</button>
    <button type="button" class="quick-chip" data-fill="Can you explain the underlying concept in simpler terms?">💡 Explain simply</button>
    <button type="button" class="quick-chip" data-fill="Give me one small hint — don't solve it, just point me in the right direction.">🧭 Small hint</button>
    <button type="button" class="quick-chip" data-fill="Could you check my reasoning so far? Here it is: ">🔍 Check my work</button>
  </div>
  <form class="chat-input" id="chat-form">
    <textarea id="chat-text" rows="1" placeholder="Ask anything about this…" required></textarea>
    <button class="btn primary" id="chat-send" type="submit">Send</button>
  </form>
</section>
<script src="/static/js/chat.js" defer></script>
