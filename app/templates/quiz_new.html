{% extends "base.html" %}
{% block title %}New quiz — Nudge{% endblock %}
{% block content %}
<div class="form-card card">
  <h1>New quiz</h1>
  <p class="muted">For <a href="/classes/{{ klass.id }}">{{ klass.name }}</a> — auto-graded the moment students submit.</p>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="post" action="/classes/{{ klass.id }}/quizzes/new">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Title<input type="text" name="title" required maxlength="200" placeholder="e.g. Chapter 4 checkpoint"></label>
    <label>Instructions <span class="hint">(optional)</span><textarea name="instructions" rows="4" placeholder="What should students know before starting?"></textarea></label>
    <label>Due <span class="hint">(optional)</span><input type="datetime-local" name="due_at"></label>
    <button class="btn primary" type="submit">Create quiz</button>
  </form>
</div>
{% endblock %}
